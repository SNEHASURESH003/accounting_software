{% extends "base.html" %}

{% block 'content' %}
<style>
  .delete-card {
    max-width: 500px;
    margin: 60px auto;
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
    text-align: center;
  }

  .delete-card h1 {
    font-size: 24px;
    margin-bottom: 20px;
    color: #d32f2f;
  }

  .delete-card p {
    font-size: 16px;
    margin-bottom: 30px;
  }

  .delete-card button {
    background-color: #d32f2f;
    color: white;
    padding: 12px 20px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 10px;
  }

  .delete-card button:hover {
    background-color: #b71c1c;
  }

  .delete-card a {
    color: #555;
    text-decoration: none;
    font-weight: bold;
  }

  .delete-card a:hover {
    text-decoration: underline;
  }
</style>

<div class="delete-card">
  <h1>🗑️ Delete Vendor</h1>
  <p>Are you sure you want to delete "<strong>{{ object.name }}</strong>"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'vendor_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
