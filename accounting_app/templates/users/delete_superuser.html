{% extends "base.html" %}

{% block 'content' %}
<div class="container mt-5">
  <div class="card shadow-lg border-0 rounded-4 text-center">
    <div class="card-body">
      <h3 class="fw-bold text-danger">Delete Admin</h3>
      <p>Are you sure you want to delete <strong>{{ superuser.email }}</strong>?</p>

      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'superuser_list' %}" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
