<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Trial Balance PDF</title>
    <style>
        @page {
            size: A4;
            margin: 1in;
        }

        body {
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            color: #212529;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 20px;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #444;
            padding: 6px 8px;
            font-size: 12px;
        }

        th {
            background-color: #f2f2f2;
            text-align: left;
            font-weight: 600;
        }

        td {
            text-align: right;
        }

        td:first-child {
            text-align: left;
        }

        tfoot td {
            font-weight: bold;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h2>Trial Balance Report</h2>
    <table>
        <thead>
            <tr>
                <th>Account</th>
                <th>Debit</th>
                <th>Credit</th>
                <th>Balance</th>
            </tr>
        </thead>
        <tbody>
            {% for name, debit, credit, balance in rows %}
            <tr>
                <td>{{ name }}</td>
                <td>{{ debit|floatformat:2 }}</td>
                <td>{{ credit|floatformat:2 }}</td>
                <td>{{ balance|floatformat:2 }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
