<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Accounting Software</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Fullscreen background */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      overflow: hidden;
    }

    /* Sparkle background */
    .stars {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      box-shadow: 
        50px 100px white,
        150px 200px #ffd700,
        250px 300px #fff,
        350px 400px #87ceeb,
        450px 150px #f0f8ff,
        550px 250px #ff69b4,
        650px 350px #fffacd,
        750px 120px #00ffff;
      animation: twinkle 3s infinite ease-in-out alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.2; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  
  <main class="w-100 d-flex justify-content-center align-items-center">
    {% block 'content' %}{% endblock %}
  </main>
</body>
</html>
