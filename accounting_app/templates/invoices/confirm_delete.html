{% extends 'base.html' %}
{% block 'content' %}
<div class="alert alert-danger mt-4">
  <h4>⚠️ Confirm Deletion</h4>
  <p>Are you sure you want to delete invoice <strong>#{{ invoice.id }}</strong> for <strong>{{ invoice.client.name }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">🗑️ Yes, Delete</button>
    <a href="{% url 'invoice_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
