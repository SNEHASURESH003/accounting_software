{% extends "base.html" %}
{% block 'content' %}
<h2>My Expenses</h2>
<table class="table">
  <thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Status</th></tr></thead>
  <tbody>
    {% for expense in expenses %}
      <tr>
        <td>{{ expense.date }}</td>
        <td>{{ expense.get_category_display }}</td>
        <td>{{ expense.amount }}</td>
        <td>{{ expense.status }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
