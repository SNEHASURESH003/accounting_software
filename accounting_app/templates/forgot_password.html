{% extends 'base_auth.html' %}
{% block 'content' %}
<style>
  body, html {
    height: 100%;
    margin: 0;
    background: linear-gradient(135deg, #8089a0ff 0%, #4e486bff 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
  }

  .forgot-wrapper {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    padding: 3rem 3rem 2rem;
    width: 100%;
    max-width: 600px;
    box-sizing: border-box;
    text-align: center;
  }

  h2 {
    color: #391753;
    margin-bottom: 1.5rem;
    font-weight: 700;
  }

  form {
    max-width: 400px;
    margin: 0 auto;
  }

  form p {
    font-size: 1.1rem;
    margin-bottom: 1rem;
    text-align: left;
  }

  input[type="email"], input[type="text"] {
    width: 100%;
    padding: 0.75rem 1rem;
    margin-bottom: 1.25rem;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 1rem;
    box-sizing: border-box;
    transition: border-color 0.3s ease;
  }

  input[type="email"]:focus, input[type="text"]:focus {
    border-color: #2575fc;
    outline: none;
  }

  button {
    background-color: #2575fc;
    color: white;
    font-weight: 600;
    font-size: 1.1rem;
    padding: 0.75rem 0;
    width: 100%;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  button:hover {
    background-color: #1a53d1;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .forgot-wrapper {
      padding: 2rem 1.5rem;
      max-width: 90%;
    }
  }
</style>

<div class="forgot-wrapper">
  <h2>Forgot Password</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
 <button type="submit">Send Reset Link</button><br></br>
<a href="{% url 'login' %}" class="btn btn-secondary" role="button" style="margin-left: 10px;">Cancel</a>

  </form>
</div>
{% endblock %}
