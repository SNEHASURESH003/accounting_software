
<form method="get" class="filters" style="margin-bottom:1rem; display:flex; gap:.5rem; flex-wrap:wrap;">
  <label>
    Year:
    <select name="year">
      {% if years %}
        {% for y in years %}
          <option value="{{y}}" {% if y|stringformat:"s" == year|stringformat:"s" or y|stringformat:"s" == selected_year %}selected{% endif %}>{{y}}</option>
        {% endfor %}
      {% else %}
        <option value="{{year}}">{{year}}</option>
      {% endif %}
    </select>
  </label>

  <label>
    Project:
    <select name="project">
      <option value="">All</option>
      {% for p in projects %}
        <option value="{{p.id}}" {% if selected_project_id == p.id|stringformat:"s" %}selected{% endif %}>{{p.name}}</option>
      {% endfor %}
    </select>
  </label>

  <button type="submit">Apply</button>

  <a href="{% url 'forecast_table' %}">Table</a>
  <a href="{% url 'forecast_vs_actual' %}{% if year or selected_year or selected_project_id %}?year={{year|default:selected_year}}&project={{selected_project_id}}{% endif %}">Vs Actual</a>
  <a href="{% url 'forecast_add' %}">Add Forecast</a>
  <a href="{% url 'forecast_rebuild_from_invoices' %}">Rebuild from Invoices</a>
</form>
